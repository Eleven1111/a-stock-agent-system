name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Cron manifest
        run: python scripts/validate_cron_manifest.py
      - name: Compile
        run: python -m compileall -q skills scripts tests
      - name: Maintainability budget
        run: python scripts/check_maintainability_budget.py --base-ref HEAD^
