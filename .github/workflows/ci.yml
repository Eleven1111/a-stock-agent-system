name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Cron manifest
        run: python scripts/validate_cron_manifest.py
      - name: Compile
        run: python -m compileall -q skills scripts tests
      - name: Maintainability budget
        run: python scripts/check_maintainability_budget.py --base-ref HEAD^
