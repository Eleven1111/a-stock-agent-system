[project]
name = "a-stock-agent-system"
version = "1.4.0"
description = "A股全栈Agent系统 — 13个仓内Skill × 完整投资决策闭环"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Eleven1111"}]

dependencies = [
    "yfinance>=0.2.0",
    "akshare>=1.18.0",
    "adata>=2.9",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pypdf>=3.0",   # 公告正文抽取（announcement-radar 第四步深读）——曾是 extra，生产环境缺失导致静默降级
    "easy-tdx>=1.20.6",  # MAC 0x123D 集合竞价（09:15-09:25）
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
fundamentals = ["baostock>=0.9"]
deephistory = ["mootdx>=0.11", "easy-tdx>=1.20.6"]   # 通达信 TCP 日线 + MAC 0x123D 竞价源
auction = ["easy-tdx>=1.20.6", "mootdx>=0.11"]   # 真实竞价量能链（09:15-09:25）
research = ["pypdf>=3.0"]   # 已并入主依赖，保留仅为兼容既有 `pip install .[research]` 命令
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skills*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # 长行（中文字符串多，不强制折行）
    "F841",   # 未使用变量（脚本中临时变量难免）
    "E402",   # 模块级导入不在顶部（skills 间动态 sys.path 插入的常见模式）
    "E266",   # 过多 # 号（中英文文档注释的合理用法）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
