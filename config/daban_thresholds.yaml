# 打板阈值 — 单一事实源（Single Source of Truth）
# ===================================================
# 实盘候选闸门 daban-stock-picker/daban_candidate_api.py 与
# 离线回测引擎 chanlun-backtest/daban_bt_engine.py 共读本文件。
#
# 铁律：本文件的入场/过滤阈值，只允许在 daban_bt_run → research_gate 返回 passed
# （allowed_in_live_agent=true）之后变更。禁止根据近期实盘结果直接回拟合（过拟合）。
# 实盘表现差的策略走 strategy_registry 门控停用，不在此处改阈值。

cost:
  commission: 0.00025
  stamp: 0.0005
  slippage: 0.002

auction:
  gap_window_low: -1.0      # 二板弱转强竞价窗口下沿 %
  gap_window_high: 3.0      # 上沿 %
  auction_seal_minute: 565  # 真集合竞价封板上限 09:25 → 9*60+25

universe:
  float_mktcap_min: 1500000000.0   # 1.5亿*10 = 15亿
  float_mktcap_max: 12000000000.0  # 120亿
  avg_turnover_20d_min: 200000000.0  # 2亿
  close_prev_min: 4.0
  close_prev_max: 35.0
  listed_days_min: 60

first_board_reseal:
  first_limitup_latest: "10:30"
  open_board_max: 2
  reseal_minutes_max: 15
  seal_amount_ratio_min: 0.003
  active_buy_ratio_min: 0.60
  big_order_inflow_ratio_min: 0.08
  sector_limitup_min: 3

second_board_weak_to_strong:
  auction_gap_low: -1.0
  auction_gap_high: 3.0
  first_limitup_latest: "09:45"
  sector_companion_min: 2

market_gate:
  yday_limitup_index_open_min: -2.0
  broken_rate_first20m_max: 35.0
  week_trades_max: 3
  day_loss_pct_stop: -2.0
  week_loss_pct_freeze: -5.0
  consecutive_losses_max: 3
  position_time_stop_trading_days: 2  # 打板仓位持有超过N个交易日仍未走出行情，无论盈亏提示了结

# ── P1 影子闸门（打板优化方案 §3 P1）───────────────────────────────────────────
# 默认 enabled:false，只做影子记录，绝不影响实盘排序/评分/信号。启用前必须用影子
# 日志 + strategy_attribution_report 做"假想拦截 vs 实际结算"对照。缺块回退
# daban_config.DEFAULTS（同值），行为与未配置时一致。
emotion_cycle:
  enabled: false
  second_divergence_min: 2        # 分歧计数≥此值=二次以上分歧（手册 E-02 防退潮）
  weaken_states: ["S6"]           # 退潮状态：影子拦截全部新开仓（手册 E-05）
  divergence_states: ["S5"]       # 分歧状态：影子降级二板弱转强（手册 R-03）
  rise_reset_states: ["S3"]       # 主升确认：分歧计数清零（分歧转一致重新起算）

index_trend:
  enabled: false
  index_code: "000001"            # 上证指数
  index_market: "sh"
  ma_periods: [5, 10, 20]
  volume_shrink_ratio: 0.7        # 两日量能<20日均量*此值=缩量降仓（手册 T-05 相对口径）
  defend_below_ma: 20             # 收盘跌破20日线→防守（手册 T-02）
  reduce_below_ma: 5              # 收盘跌破5日线→减仓（手册 T-02）
  min_bars: 21                    # 不足则 fail-closed

# ── P5(a) 回测成交约束模型（升级方案 §8.1）───────────────────────────────────
# 只影响回测的可成交性判定与滑点，不含任何入场/过滤阈值——上面的入场阈值一条未动。
# 实现见 skills/common/execution_constraints.py；缺数据一律 fail-closed 拒绝成交。
execution_constraints:
  enabled: true                     # 一字禁买/回封参与率/跌停顺延，默认启用
  order_amount: 200000.0            # 单笔委托金额（元），参与率上限的分母基准
  volume_lot_shares: 100.0          # 日线 volume 单位为「手」，1手=100股；缺 amount 时按此折算
  max_participation_rate: 0.01      # 单笔参与率上限 = 当日成交额 1%（方案给 1%-2%）
  reseal_participation_rate: 0.01   # 回封买入参与率上限（板上换手更薄，不高于常态）
  reseal_min_amount: 20000000.0     # 回封日成交额下限2000万，不足=板上无换手→买不进
  limit_down_min_amount: 10000000.0 # 跌停日承接量下限1000万，不足→拒卖顺延
  slippage_bps_normal: 20.0         # 常态档 5-20bp，保守取上沿
  slippage_bps_volatile: 50.0       # 高波动档 20-50bp，保守取上沿
  volatile_range_pct: 6.0           # 当日振幅(高-低)/昨收 ≥ 此值 → 高波动档
  slippage_tiering: false           # 默认关闭：开启会重定价全部历史回测，须走 research_gate

# P3 S1 超预期（RankSurprise）研究策略参数 — NON-LIVE，新增节，不改任何既有入场/过滤阈值。
# 预期基准 ExpectedGap = Median(Gap_peer) + β₁·昨日收益% + β₂·连板高度；Surprise = 实际 − 预期。
# β 尚未拟合（betas_fitted:false）：置 0 意味着预期基准退化为 peer 中位数，这是**占位**，
# 不是结论；拟合前不得据此出任何胜率/PF 结论，更不得注册进 strategy_registry。
rank_surprise:
  beta_prior_return: 0.0            # β₁：昨日收益(%)对今日 gap 的线性系数（未拟合占位）
  beta_board_height: 0.0            # β₂：连板高度对今日 gap 的线性系数（未拟合占位）
  betas_fitted: false               # 拟合状态；false 时信号结果带 degraded 标记
  min_peer_count: 5                 # 同板块 peer 样本下限，不足 → unavailable（绝不返回0）
  prior_rank_bottom_pct: 0.30       # 条件1：昨日板块内强度排名后 30%
  auction_rank_top_pct: 0.20        # 条件2：今日竞价强度进前 20%
  min_volume_ratio: 1.5             # 条件3：量比 > 1.5（严格大于）
  volume_ratio_deadline: "09:45"    # 条件3 的口径：09:45 前量比；日线全日量比不满足该口径
  ebbing_states: ["S6"]             # 条件4：题材退潮状态（复用 market_cycle_state 的 S 口径）

# P3 S2 龙头分歧回封（DivergenceReseal）研究策略参数 — NON-LIVE，新增节，不改任何既有阈值。
# 信号：板块涨停≥3 ∧ 板块内存在大量一字/快速板 ∧ 目标是前2个完成充分换手后回封的前排股
# ∧ 封板前换手 ≥ 20日同期中位数的1.5-3.0倍（升级方案 §6.1）。
# "前2个"按回封**时刻**的先后排序，只用截至该时刻的信息判定，不看后续是否炸板——
# 这是本策略的成败点，实现与测试都必须守住（见 skills/common/divergence_reseal.py）。
# 回测事件表 v4 构建口径 — 新增节，只影响 daban_bt_data 的字段派生，不含任何入场/过滤阈值。
# 分档时间阈值用分钟数（HH*60+MM），与 auction.auction_seal_minute 同口径。
event_table_v4:
  one_word_seal_minute: 565           # 首次封板 ≤09:25（集合竞价即封）→ 计入一字板家数
  fast_board_seal_minute: 571         # 首次封板 ≤09:31 → 计入一字/快速板家数（含一字）
  turnover_baseline_window: 20        # 换手基准回看窗口（事件日之前的 N 个交易日，不含事件日）
  turnover_baseline_min_days: 15      # 有效样本天数下限，不足 → 基准 unavailable（绝不给默认值）
  # 分钟线派生字段口径（2026-08 新增，只影响 daban_bt_data 的 volume_ratio 派生）：
  volume_ratio_checkpoint: "09:45"    # 量比时点，与 rank_surprise.volume_ratio_deadline 同口径
  volume_ratio_baseline_days: 5       # 量比基准 = 事件日之前 5 个交易日的每分钟均量（股/分钟）
                                      # 不足 5 天 → 基准 unavailable（绝不用手上的两三天凑）

divergence_reseal:
  min_sector_limit_up_count: 3        # 条件1：板块涨停家数下限
  min_sector_fast_seal_count: 2       # 条件2：板块内一字/快速板家数下限（"大量"的可执行口径）
  reseal_rank_top_n: 2                # 条件3：按回封时刻先后排名，取前 N（方案原文"前2个"）
  min_turnover_ratio: 1.5             # 条件4下限：封板前换手 ≥ 20日同期中位数的1.5倍（含）
  max_turnover_ratio: 3.0             # 条件4上限：封板前换手 ≤ 20日同期中位数的3.0倍（含）
  min_baseline_sample_days: 15        # 20日同期基准样本下限，不足 → unavailable（绝不返回0）
  preferred_baseline_sample_days: 20  # 低于此天数但≥下限时，标记 degraded（口径打折但不阻断）

# P3 S3 最强助攻套利（AssistArbitrage）研究策略参数 — NON-LIVE，新增节，不改任何既有阈值。
# 信号：龙头 LeaderScore≥80（复用 leader_score_shadow，不重造）∧ 板块广度≥3 ∧
# 候选连板高度≤龙头连板高度-1 ∧ 候选题材内相对强度Top20% ∧ 龙头确认后候选率先突破
# 日内关键位（升级方案 §6.1）。退出：龙头走弱∧题材广度下降，或新主线DirectionScore
# 超原主线≥15分——退出判定与入场完全独立，见 skills/common/assist_arbitrage.py。
assist_arbitrage:
  min_leader_score: 80.0              # 条件1：龙头 LeaderScore 下限（取自 leader_score_shadow）
  min_sector_breadth_count: 3         # 条件2：板块涨停家数下限
  min_board_level_gap: 1              # 条件3：候选连板高度 ≤ 龙头连板高度 - 此值（至少矮一级）
  relative_strength_field: change_pct # 条件4：相对强度排名依据字段
  relative_strength_top_pct: 0.20     # 条件4：候选需位于题材内前 20%
  min_theme_peer_count: 5             # 题材同组样本下限，不足 → unavailable（绝不返回0）
  breakout_rank_top_n: 1              # 入场触发：按突破时刻排名，取前 N（方案原文"率先"取1）
  leader_weak_change_pct_max: -3.0    # 退出A：龙头当日涨跌幅 ≤ 此值视为走弱（或已开板失守）
  breadth_decline_min_drop: 1.0       # 退出A：题材广度较对照时点下降 ≥ 此值家数
  min_rotation_gap: 15.0              # 退出B：新主线 DirectionScore 超原主线 ≥ 此值

# P3 S4 先于龙头套利（PreleaderArbitrage）研究策略参数 — NON-LIVE，新增节，不改任何既有阈值。
# 信号：D-1 晚间已建立「龙头候选→属性→同属性首板候选」盘前表(build_pretable，只用
# D-1及更早数据、排除重大利空/流动性不足) ∧ D0 龙头确认后，候选须在盘前表候选列表内
# ∧ 候选在龙头确认后 max_reaction_minutes 分钟内完成自身反应 ∧ 候选自身流动性达标
# （升级方案 §6.1）。盘中不做临时选股是本策略的成败点，见 skills/common/preleader_arbitrage.py。
preleader_arbitrage:
  max_reaction_minutes: 10.0          # 条件3：候选须在龙头确认后此分钟数内完成自身反应
  min_candidate_amount: 20000000.0    # 条件4：候选当日成交额下限2000万，不足→流动性不足
  min_member_avg_turnover: 20000000.0 # 盘前表构建：属性成分股20日均成交额下限，不足→建表阶段排除
