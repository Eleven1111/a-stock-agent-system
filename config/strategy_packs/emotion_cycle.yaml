# 情绪周期策略包 — 描述性特征层（NON-LIVE·方向假设已被探针证伪）
# =============================================================================
# 声明式策略包，只用于 agent 解释推荐时引用的判断标准。绝不影响实盘排序 / 评分 /
# 信号（AGENTS.md 红线）。想影响实盘 → 走 research_gate 样本外验证并在
# strategy_registry 登记。通用模板，不含具体股票 / 板块名称。
#
# 本包的方向性假设（情绪底=蓄势待涨 / 情绪顶=出货该跌）已于 2026-08-13/14 的小样本
# 探针中未获支持（详见下方 research_status 与 issue #232），因此：
#   - interpretation 只保留"该标的当前处于什么量价状态"的描述，不给时机含义；
#   - score_hints 清空 —— 已被证伪的方向性加减分展示给用户，比不展示更糟。
# 历史 hints 内容不在此文件保留，去 issue #232 与 git history 查。

name: emotion_cycle
display_name: 情绪周期
description: >-
  用换手率分档、量能收缩/爆量特征与均线形态，描述个股当前所处的量价状态（冷却缩量
  一端 vs 高位放量一端）。仅作为可观测的描述性证据，其方向含义已被探针证伪，不构成
  时机判断，更不构成买卖指令。
category: reversal

# 情绪周期解释在全温度域都有意义（底部蓄势与顶部出货是对称的两端），因此适用于
# 情绪温度五档全档；冰点/极热两端正是判断"底"与"顶"最关键处。
market_regimes:
  - 冰点
  - 修复
  - 发酵
  - 加速
  - 极热

evidence_requirements:
  - turnover                 # 当日换手率 (%)，用于分档
  - volume_spike_ratio       # 当日量能相对前20日均量，识别缩量蓄势/爆量出货嫌疑
  - change_pct               # 当日涨跌幅，配合爆量判断出货 vs 蓄势
  - ma_coil_ratio            # 均线粘合度（蓄势特征）
  - atr_contraction_pct      # ATR 收缩/扩张分位，辅助识别蓄势 vs 过热
  - above_ma20               # 是否站上 20 日均线

# 探针结论（负结果，固化以防复活）—— issue #232，2026-08-13/14 小样本探针。
# 小样本、前复权日 K、未计手续费/T+1/仓位约束，不是正式策略验证；结论只用于否定，
# 不用于肯定任何方向。
research_status: >-
  falsified_direction（探针未通过，不进入完整 research_gate）。
  1) 情绪底信号：20 日超额约 0，与噪声无法区分，"缩量蓄势→待涨"未获支持。
  2) 情绪顶信号：方向与假设相反 —— 爆量滞涨后 20 日 pooled 超额 +4.52%，
  即"出货嫌疑→该跌"被证伪。
  3) 反向假设 emotion_top_momentum（爆量滞涨后动量延续）同样不稳健：
  20 日 pooled +0.93% 但 per-stock 中位数 -4.35%，仅 26%(10/39) 股票方向为正，
  均值由少数样本拉动。
  决策：三条方向假设均不进入完整 research_gate，本包降级为纯描述性特征层，
  score_hints 清空；F1-F5 特征保留为可观测证据，恒 0 权重。

interpretation: >-
  本包只描述"该标的当前处于什么量价状态"，不给方向或时机含义。冷却/缩量一端：换手率
  处于低分档、量能收缩、均线粘合、价格贴近或刚站上中期均线。高位/放量一端：换手率
  处于高分档、量比显著放大同时涨幅收敛或转弱（爆量滞涨）。两端只说明该标的在换手与
  量能分布中的位置，是可核对的事实性证据。注意：把冷却端读成"蓄势待涨"、把放量端
  读成"出货该跌"的方向性解读，经 2026-08 探针未获支持（顶部信号方向甚至相反，
  见 research_status 与 issue #232），agent 解释推荐时不得作为时机含义引用。

# 方向性加减分已随探针负结论下线（issue #232）。保持空列表而非删除字段：
# score_hints 是 schema 必填项，空列表表示"本包不提供任何加减分解释"。
score_hints: []
