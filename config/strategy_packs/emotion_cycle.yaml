# 情绪周期策略包 — 解释与研究假设层（NON-LIVE）
# =============================================================================
# 声明式策略包，只用于 agent 解释推荐时引用的判断标准和研究假设。绝不影响实盘
# 排序 / 评分 / 信号（AGENTS.md 红线）。想影响实盘 → 走 research_gate 样本外
# 验证并在 strategy_registry 登记。通用模板，不含具体股票 / 板块名称。

name: emotion_cycle
display_name: 情绪周期
description: >-
  从个股的换手率分档、量能收缩/爆量特征与均线形态，映射到情绪周期位置（情绪底
  蓄势 vs 情绪顶出货嫌疑），作为"该标的处于情绪周期哪一段"的研究假设。用于解释
  推荐的时机含义，不构成买卖指令。
category: reversal

# 情绪周期解释在全温度域都有意义（底部蓄势与顶部出货是对称的两端），因此适用于
# 情绪温度五档全档；冰点/极热两端正是判断"底"与"顶"最关键处。
market_regimes:
  - 冰点
  - 修复
  - 发酵
  - 加速
  - 极热

evidence_requirements:
  - turnover                 # 当日换手率 (%)，用于分档
  - volume_spike_ratio       # 当日量能相对前20日均量，识别缩量蓄势/爆量出货嫌疑
  - change_pct               # 当日涨跌幅，配合爆量判断出货 vs 蓄势
  - ma_coil_ratio            # 均线粘合度（蓄势特征）
  - atr_contraction_pct      # ATR 收缩/扩张分位，辅助识别蓄势 vs 过热
  - above_ma20               # 是否站上 20 日均线

interpretation: >-
  情绪周期定位按多条件计数，越靠近某一端命中越多，解释越强。情绪底/蓄势侧：换手率
  处于低分档且量能收缩、均线粘合、价格贴近或刚站上中期均线——表示筹码沉淀、
  情绪冷却后的蓄势。情绪顶/出货嫌疑侧：换手率处于高分档、量比显著放大同时涨幅收敛
  或转弱（爆量滞涨/爆量下跌）——表示高位放量、承接减弱的出货特征。两侧计数用于说明
  时机含义：底侧支持"逢低观察/等确认"，顶侧支持"注意兑现风险/不追高"，均为解释性
  提示，不改变任何评分。

score_hints:
  # 情绪底 / 蓄势侧（加分：时机偏有利）
  - when: turnover_low_band
    delta: 2
    reason: 换手率处于低分档，筹码沉淀，情绪冷却蓄势
  - when: turnover_trend_converging
    delta: 2
    reason: 量能近日收缩，抛压释放趋缓
  - when: ma_converged
    delta: 2
    reason: 均线粘合，方向选择前的蓄势形态
  # 情绪顶 / 出货嫌疑侧（减分：注意兑现风险）
  - when: turnover_high_band
    delta: -2
    reason: 换手率处于高分档，高位活跃度过热
  - when: blowoff_volume_stall
    delta: -3
    reason: 量比爆量而涨幅收敛/转弱，爆量滞涨出货嫌疑
