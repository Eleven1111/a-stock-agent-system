# S1 超预期策略包（RankSurprise）— 解释与研究假设层（NON-LIVE）
# =============================================================================
# 本文件是"声明式策略包"，只用于 agent 解释推荐时引用的判断标准，以及作为研究
# 假设。它绝不影响实盘排序 / 评分 / 信号（AGENTS.md 红线：任何策略未过 research
# gate 不得影响实盘排序）。想让本包影响实盘 → 走 research_gate 样本外验证并在
# strategy_registry 登记 allowed_in_live_agent=true。
#
# 红线（本包的具体形态）：
#   - strategy_registry 中**没有** rank_surprise 记录 ⇒ 消费端一律降级为 watch、
#     仓位倍率 0（decision_policy「strategy_unverified」/ recommendation_audit
#     「research_only」两条路径都会归零），这条行为由 tests/test_rank_surprise.py
#     的消费端行为断言守着，不是靠本文件的字段值自证。
#   - 未过 research_gate 之前，任何人不得把 skills/common/rank_surprise.py 的
#     surprise 值折进 daban_score / trend_score / 排序 / 仓位。
#
# 通用模板：不含任何具体股票代码 / 股票名称 / 具体板块名称。

name: rank_surprise
display_name: 超预期（弱转强）
description: >-
  识别"昨日在板块梯队里排位靠后、今日竞价却显著强于同梯队预期"的标的：先算一条
  事前可算的预期基准（同板块 peer 竞价中位数 + 昨日收益与连板高度的线性修正），
  再看实际竞价强度超出基准多少。用于解释某标的当前是否出现弱→强、分歧→一致的
  预期差，不构成买入指令。
category: pattern

# 适用市场状态：弱转强的解释力集中在情绪修复~发酵、点火~扩散阶段；退潮(S6)期
# 本包自身的入场条件 4 即判定题材已退潮，不适用。
market_regimes:
  - 修复
  - 发酵
  - S1   # 冰点回暖/萌芽
  - S2   # 点火
  - S3   # 扩散/主升
  - S5   # 分歧（分歧转一致正是本包关注的形态）

# 需要的证据字段（缺失即无法判定；实现层对缺失一律返回 unavailable，绝不按
# "默认不超预期"处理 —— 把"没数据"折叠成"不触发"会让零样本看起来像已验证的负结果）。
evidence_requirements:
  - sector                   # 板块归属，peer 梯队的分组键；缺失 → unavailable
  - auction_strength         # 今日竞价强度（ActualGap%，来自 09:24 全市场轻量竞价快照）
  - prior_strength           # 昨日板块内强度（昨日收益，封板早晚为并列时的 tiebreak）
  - prior_return_pct         # 昨日收益 (%)，预期基准的 β₁ 项
  - board_height             # 连板高度，预期基准的 β₂ 项
  - volume_ratio             # 量比（口径：09:45 前；日线全日量比不满足该口径）
  - market_state             # 市场/题材 S 状态，用于"题材未退潮"判定

# 入场四条件（升级方案 §6.1）。阈值不写在本文件里，单一事实源是
# config/daban_thresholds.yaml 的 rank_surprise 节：策略包是解释层，
# 把可执行参数放进来会模糊"解释层 vs 执行层"的边界。
entry_conditions:
  - prior_rank_bottom:  昨日板块内强度排名后 prior_rank_bottom_pct（默认 30%）
  - auction_rank_top:   今日竞价强度进板块内前 auction_rank_top_pct（默认 20%）
  - volume_ratio:       09:45 前量比 > min_volume_ratio（默认 1.5，严格大于）
  - theme_not_ebbing:   市场/题材状态不在 ebbing_states（默认 S6）内

# 预期基准（本策略的成败点，不是入场条件）：
#   ExpectedGap_i = Median(Gap_peer) + β₁·昨日收益% + β₂·连板高度
#   Surprise_i    = ActualGap_i − ExpectedGap_i
# 报告把"超预期"列为最通用的信号，同时警告它最容易事后解释——"今天涨了所以是超预
# 期"。基准必须事前可算：两个 ActualGap 相同、peer 分布不同的标的，Surprise 必须
# 不同，否则基准没起作用（由 tests/test_rank_surprise.py 断言）。

research_status: >-
  not_gated_zero_sample（未验证；既未证实也未证伪）。
  β₁/β₂ 尚未拟合（betas_fitted=false，两者置 0 是占位而非结论，此时预期基准退化
  为 peer 中位数）；本机无全市场日线缓存（sentiment_daily 0 行、覆盖率 1.15%），
  walk-forward OOS 闸门跑不了；既有 v1/v3 事件表不含 09:45 前量比，实跑真实事件
  数为 0。因此本包**没有任何**胜率 / PF / 期望值结论，任何此类数字都不存在。
  详见 docs/rank-surprise-gate-evaluation-2026-08.md。

interpretation: >-
  本包描述的是"该标的今日竞价相对同板块梯队的预期差"这一可核对的事实：先取同板块
  同交易日 peer 的竞价强度中位数作基准（再按昨日收益与连板高度做线性修正），与该
  标的实际竞价强度相减得到 Surprise。正数表示强于同梯队预期，负数表示弱于。配合
  昨日排位靠后、今日竞价靠前、量比放大、题材未退潮四条件，构成"弱转强"的研究假设。
  注意：peer 样本不足、板块缺失、量比缺失或市场状态不可用时，实现层返回 unavailable
  而非"不超预期"，agent 解释时必须照此表述，不得把不可用读成负面结论。

# 本包不提供任何加减分解释：预期基准的 β 未拟合、样本为零，此时给出任何方向性
# 加减分都是把未验证假设当结论展示。保持空列表而非删除字段（schema 必填项）。
score_hints: []
