# A股评分配置

scoring:
  weights:
    default:   {technical: 0.30, sentiment: 0.15, catalyst: 0.30, deep: 0.25}
    daban:     {technical: 0.15, sentiment: 0.35, catalyst: 0.30, deep: 0.20}
    trend:     {technical: 0.35, sentiment: 0.10, catalyst: 0.25, deep: 0.30}

  temperature_overlay:
    冰点: {sentiment: -0.05, deep: +0.05}
    修复: {}
    发酵: {}
    加速: {sentiment: +0.05, deep: -0.05}
    极热: {sentiment: +0.10, deep: -0.10}

  grades:
    S: {min: 8.0, emoji: "🟢🟢🟢", advice: "研究高分 — 多维度共振，等待完整政策复核"}
    A: {min: 6.0, emoji: "🟢🟢", advice: "研究较高分 — 技术与催化偏强，等待完整政策复核"}
    B: {min: 4.0, emoji: "🟢", advice: "研究中性 — 保持观察，不构成方向建议"}
    C: {min: 2.0, emoji: "🔶", advice: "研究偏弱 — 仅作风险观察"}
    D: {min: 0.0, emoji: "🔴", advice: "研究低分 — 仅作风险观察"}

  confidence:
    high:
      requires: [realtime, kline, news, valuation]
    medium:
      requires: [realtime, kline]
    low:
      requires: [realtime]

  # 深研过期治理阶梯（fail-closed，非回拟合参数）：
  #   新鲜（age <= max_age_days，见 deep_research_cache.DEFAULT_MAX_AGE_DAYS=90）：满权重。
  #   过渡衰减（max_age_days < age <= max_age_days + exclude_after_extra_days）：
  #     分值向 PE 快照线性回归（decay_stale_score），仍以满权重参与四维合成。
  #   重度过期（age > max_age_days + exclude_after_extra_days）：深度面退出合成加权，
  #     其余三维权重按比例归一化后合成总分，避免过期数月的深研结论继续给排序投票。
  deep_staleness:
    exclude_after_extra_days: 30

  # 四维权重研究只产生 shadow 产物。每条 lane 独立满足 60 个拟合交易日，随后
  # 再冻结 60 个未见交易日做 OOS；任何结果都不得自动覆盖本文件中的生产权重。
  weight_shadow:
    method: "dirichlet_simplex_student_t_importance_shadow_v1"
    minimum_fit_trading_days: 60
    minimum_unseen_oos_trading_days: 60
    assumed_notional: 20000
    live_effect: "none"
    automatic_promotion: false

risk:
  stop_loss_atr_mult: 2.0
  stop_loss_atr_mult_daban: 1.2
  take_profit_atr_mult: 3.0
  take_profit_atr_mult_2: 5.0
  trailing_stop_pct: 5.0
  max_single_position_pct: 25
  max_sector_exposure_pct: 40
  max_chase_pct: 7.0
  max_correlation: 0.80
  max_beta: 1.30
  max_style_exposure_pct: 40.0
  max_adv_participation_pct: 10.0
  max_portfolio_volatility_pct: 25.0
  factor_min_coverage: 0.95
  factor_max_age_days: 1

# 情绪周期确定性特征（研究信号，未过 research_gate 前 0 权重，不得影响实盘评分）。
# 阈值变更须走 research_gate 纪律，禁止看实盘回拟合。
emotion_cycle:
  strategy_id: "emotion_cycle:v1"
  volume_percentile:
    window: 60
    min_samples: 20
    buckets: {cold: 0.20, active: 0.70, hot: 0.90, extreme: 0.98}
  volume_spike:
    window: 20
    distribution_suspect: 5.0
    heavy: 2.5
    shrink: 0.5
  ma_coil:
    periods: [5, 10, 20]
    coil_threshold: 0.02
  atr_contraction:
    period: 14
    min_atr_points: 10
    contracting_pct: 0.20
    expanding_pct: 0.90
  synthesis:
    bottom_min: 3
    top_min: 2

# 统一情绪评分 S_t（升级方案 P0-c，SHADOW ONLY）。
# skills/common/sentiment_score.py 内**没有**这些数字的副本：本节缺失时该模块整体
# 返回 unavailable，绝不静默回退。所有数值均为待检验初始参数（原书取值），未经
# 任何历史收益校准，输出恒带 calibrated=false，不得影响实盘排序/仓位。
sentiment_score:
  quantile_window: 120        # 滚动分位窗口（交易日）
  min_history: 180            # 预热下限：短于此长度一律 unavailable
  min_available_weight: 0.60  # 分量降级后仍需覆盖的权重下限
  components:
    premium:      {field: limit_premium_close, weight: 0.20, invert: false}
    limit_count:  {field: limit_count,         weight: 0.15, invert: false}
    adr:          {field: adr,                 weight: 0.15, invert: false}
    break_rate:   {field: break_rate,          weight: 0.15, invert: true}
    max_board:    {field: max_board,           weight: 0.15, invert: false}
    board4plus:   {field: board4plus,          weight: 0.10, invert: false}
    leader_health: {field: leader_damage,      weight: 0.10, invert: false}
  bands:
    - {name: 冰点, min: 0}
    - {name: 修复, min: 20}
    - {name: 发酵, min: 40}
    - {name: 加速, min: 60}
    - {name: 极热, min: 80}
  ice_confirm:
    prev_score_max: 20
    delta_min: 10
    sector_breadth_min: 3

# 龙头连续评分 LeaderScore（升级方案 P2-a，SHADOW ONLY）。
# hot_money_selection.leader_score 内**没有**这些数字的副本：本节缺失时整体返回
# unavailable。它与既有的 leader_score（= 100 - (rank-1)*15 的排名代理）是两个
# 字段：新分写入 leader_score_shadow，既有离散身份标签与排序一律不动。
# 全部为待检验初始参数（方案 §5.1a 表），未经任何历史收益校准，输出恒带
# calibrated=false，不得进入 gate/timing/排序。
leader_score:
  # 降级后仍需覆盖的权重下限。池外标的必然丢掉 F(0.20)+R(0.15)=0.35，
  # 余 0.65 仍可出分；再丢一维即整体 unavailable。
  min_available_weight: 0.60
  factors:
    # H 高度：自身连板高度 / 全场最高板。缺任一即该维不可用。
    height:            {weight: 0.25}
    # F 封速/首封排名：距 09:30 的分钟数越小越强；仅深度池内可得。
    seal_speed:        {weight: 0.20, deep_pool_only: true, full_scale_minutes: 60}
    # R 分歧承接：开板次数 + 回封耗时；仅深度池内可得。
    resilience:        {weight: 0.15, deep_pool_only: true,
                        max_open_count: 3, reseal_full_scale_minutes: 30}
    # B 助攻广度：板块内除自己以外的涨停家数。
    assist_breadth:    {weight: 0.15, full_scale_assists: 5}
    # RS 相对强度：相对全市场中位与板块前十均值的超额，双向对称映射到 0-1。
    relative_strength: {weight: 0.15, excess_full_scale_pct: 10.0}
    # A 关注度：social_attention 的多源关注分。
    attention:         {weight: 0.10, full_scale_score: 100.0}
  # "最高板 ≠ 龙头"：高位孤板 + 后排连续大面 → B、R 归零（是观测到的 0，
  # 不是 unavailable，因此权重仍留在分母里，分数必须掉下来）。
  isolation_penalty:
    max_assist_limitups: 1        # 板块内除自己外涨停家数 ≤ 此值 = 孤板
    back_row_damage_min_days: 2   # 后排"大面"需连续天数
    break_rate_min: 0.5           # 中位板炸板率 ≥ 此值算当日后排大面
    leader_damage_max_pct: -5.0   # 或龙头次日收益 ≤ 此值算当日后排大面

# 题材评分 ThemeScore 新·时·广（升级方案 P2-b，SHADOW ONLY）。
# theme_strength.theme_score 内**没有**这些数字的副本；本节缺失即 unavailable。
# 不替换既有 4 因子板块分（sector_weights），只作平行研究字段。
theme_score:
  # 三维权重（方案 §5.1b）：0.35N + 0.30T + 0.35B。
  weights: {novelty: 0.35, timing: 0.30, breadth: 0.35}
  # S_t 不可用时 T 维降级，余 0.70 仍可出分；再丢一维即整体 unavailable。
  min_available_weight: 0.65
  novelty:
    half_life_days: 5      # theme_registry.created_at 距今天数的半衰期
    age_weight: 0.6        # N 内部两个子分量的权重（各自可单独降级并重归一化）
    news_weight: 0.4
  timing:
    # S_t 分档 → 时机分：题材真空/修复窗口最有利，极热最不利。
    band_scores: {冰点: 0.5, 修复: 1.0, 发酵: 0.8, 加速: 0.4, 极热: 0.1}
    delta_bonus: 0.1       # ΔS > 0 的加成，与分档分相加后 clip 到 [0, 1]
  breadth:
    full_scale_limit_ups: 5
    up_ratio_weight: 0.5   # B = 0.5 * 涨停家数分 + 0.5 * 上涨占比
