# A股评分配置

scoring:
  weights:
    default:   {technical: 0.30, sentiment: 0.15, catalyst: 0.30, deep: 0.25}
    daban:     {technical: 0.15, sentiment: 0.35, catalyst: 0.30, deep: 0.20}
    trend:     {technical: 0.35, sentiment: 0.10, catalyst: 0.25, deep: 0.30}

  temperature_overlay:
    冰点: {sentiment: -0.05, deep: +0.05}
    修复: {}
    发酵: {}
    加速: {sentiment: +0.05, deep: -0.05}
    极热: {sentiment: +0.10, deep: -0.10}

  grades:
    S: {min: 8.0, emoji: "🟢🟢🟢", advice: "强烈推荐 — 多维度共振看多"}
    A: {min: 6.0, emoji: "🟢🟢", advice: "推荐 — 技术面偏多，有催化支撑"}
    B: {min: 4.0, emoji: "🟢", advice: "观察 — 中性偏多，等待信号确认"}
    C: {min: 2.0, emoji: "🔶", advice: "谨慎 — 偏空信号，控制仓位"}
    D: {min: 0.0, emoji: "🔴", advice: "回避 — 多维度利空"}

  confidence:
    high:
      requires: [realtime, kline, news, valuation]
    medium:
      requires: [realtime, kline]
    low:
      requires: [realtime]

  # 深研过期治理阶梯（fail-closed，非回拟合参数）：
  #   新鲜（age <= max_age_days，见 deep_research_cache.DEFAULT_MAX_AGE_DAYS=90）：满权重。
  #   过渡衰减（max_age_days < age <= max_age_days + exclude_after_extra_days）：
  #     分值向 PE 快照线性回归（decay_stale_score），仍以满权重参与四维合成。
  #   重度过期（age > max_age_days + exclude_after_extra_days）：深度面退出合成加权，
  #     其余三维权重按比例归一化后合成总分，避免过期数月的深研结论继续给排序投票。
  deep_staleness:
    exclude_after_extra_days: 30

risk:
  stop_loss_atr_mult: 2.0
  stop_loss_atr_mult_daban: 1.2
  take_profit_atr_mult: 3.0
  take_profit_atr_mult_2: 5.0
  trailing_stop_pct: 5.0
  max_single_position_pct: 25
  max_sector_exposure_pct: 40
  max_chase_pct: 7.0

# 情绪周期确定性特征（研究信号，未过 research_gate 前 0 权重，不得影响实盘评分）。
# 阈值变更须走 research_gate 纪律，禁止看实盘回拟合。
emotion_cycle:
  strategy_id: "emotion_cycle:v1"
  volume_percentile:
    window: 60
    min_samples: 20
    buckets: {cold: 0.20, active: 0.70, hot: 0.90, extreme: 0.98}
  volume_spike:
    window: 20
    distribution_suspect: 5.0
    heavy: 2.5
    shrink: 0.5
  ma_coil:
    periods: [5, 10, 20]
    coil_threshold: 0.02
  atr_contraction:
    period: 14
    min_atr_points: 10
    contracting_pct: 0.20
    expanding_pct: 0.90
  synthesis:
    bottom_min: 3
    top_min: 2
